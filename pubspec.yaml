name: fresh_meat_market
description: Fresh Meat - halal meat delivery with local butchers, cash on delivery.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  uuid: ^4.4.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^6.2.2
  http: ^1.6.0
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
